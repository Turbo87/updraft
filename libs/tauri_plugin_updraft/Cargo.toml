[package]
name = "tauri-plugin-updraft"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
links = "tauri-plugin-updraft"

[lints]
workspace = true

[build-dependencies]
tauri-plugin = { version = "=2.7.0", features = ["build"] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.0", features = [] }
thiserror = "=2.0.21"
uuid = { version = "=1.26.1", features = ["serde"] }

[dev-dependencies]
claims = "=0.8.0"
insta = { version = "=1.48.0", features = ["json"] }
