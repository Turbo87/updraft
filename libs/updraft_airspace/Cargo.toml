[package]
name = "updraft_airspace"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
openair = "=0.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
ts-rs = { version = "=12.0.1", optional = true }
updraft_geo = { path = "../updraft_geo" }
updraft_units = { path = "../updraft_units" }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
approx = "=0.6.0-rc2"
claims = "=0.8.0"
