[package]
name = "updraft_airspace"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
openair = "=0.5.0"
serde_json = "=1.0.151"
thiserror = "=2.0.19"
time = { version = "=0.3.55", features = ["formatting"] }
updraft_geo = { path = "../updraft_geo" }
updraft_units = { path = "../updraft_units" }

[dev-dependencies]
approx = "=0.6.0-rc2"
claims = "=0.8.0"
insta = { version = "=1.48.0", features = ["json"] }
