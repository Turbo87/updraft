[package]
name = "updraft_condor"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.104"
bytes = "=1.12.1"
clap = { version = "=4.6.6", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
updraft_nmea = { path = "../updraft_nmea" }
updraft_units = { path = "../updraft_units" }

[dev-dependencies]
claims = "=0.8.0"
insta = "=1.48.0"
tempfile = "=3.27.0"
