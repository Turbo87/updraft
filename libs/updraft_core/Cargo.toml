[package]
name = "updraft_core"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
openair = "=0.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
time = "=0.3.55"
tracing = "=0.1.44"
ts-rs = { version = "=12.0.1", features = ["uuid-impl"], optional = true }
updraft_egm96 = { path = "../updraft_egm96" }
updraft_geo = { path = "../updraft_geo" }
updraft_nmea = { path = "../updraft_nmea" }
updraft_units = { path = "../updraft_units" }
uuid = { version = "=1.24.0", features = ["serde"] }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
approx = "=0.6.0-rc2"
claims = "=0.8.0"
insta = { version = "=1.48.0", features = ["filters", "json"] }
tempfile = "=3.27.0"
tracing-test = "=0.2.6"

[[example]]
name = "generate_protocol_bindings"
required-features = ["ts"]
