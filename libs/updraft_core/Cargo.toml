[package]
name = "updraft_core"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
ts-rs = { version = "=12.0.1", optional = true }
updraft_egm96 = { path = "../updraft_egm96" }
updraft_geo = { path = "../updraft_geo" }
updraft_nmea = { path = "../updraft_nmea" }
updraft_units = { path = "../updraft_units" }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
approx = "=0.6.0-rc2"
claims = "=0.8.0"
insta = { version = "=1.48.0", features = ["json"] }
tempfile = "=3.27.0"

[[example]]
name = "generate_protocol_bindings"
required-features = ["ts"]
