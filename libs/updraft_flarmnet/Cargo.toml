[package]
name = "updraft_flarmnet"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ts-rs = { version = "=12.0.1", optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
claims = "=0.8.0"
insta = { version = "=1.48.0", features = ["json"] }
