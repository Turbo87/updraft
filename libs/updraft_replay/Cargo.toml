[package]
name = "updraft_replay"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.104"
bytes = "=1.12.1"
clap = { version = "=4.6.5", features = ["derive"] }
indicatif = "=0.18.6"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-indicatif = "=0.3.14"
tracing-subscriber = "=0.3.23"
updraft_nmea = { path = "../updraft_nmea" }

[dev-dependencies]
claims = "=0.8.0"
tokio = { version = "=1.53.1", features = ["test-util"] }
