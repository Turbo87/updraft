[package]
name = "updraft_terrain"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.104"
image-webp = "=0.2.4"
imagesize = "=0.15.0"
moka = { version = "=0.12.16", features = ["sync"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
updraft_geo = { path = "../updraft_geo" }

[dev-dependencies]
claims = "=0.8.0"
criterion = "=0.8.2"
tempfile = "=3.27.0"

[[bench]]
name = "elevation"
harness = false
