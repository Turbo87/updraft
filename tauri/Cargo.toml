[package]
name = "updraft_tauri"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[lib]
name = "updraft_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.23.1"
hex = "=0.4.3"
flate2 = "=1.1.10"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-updraft = { path = "../libs/tauri_plugin_updraft" }
tempfile = "=3.27.0"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["macros", "parsing"] }
updraft_waypoint = { path = "../libs/updraft_waypoint" }
updraft_airspace = { path = "../libs/updraft_airspace" }
updraft_core = { path = "../libs/updraft_core" }
updraft_flarmnet = { path = "../libs/updraft_flarmnet" }
updraft_geo = { path = "../libs/updraft_geo" }
updraft_terrain = { path = "../libs/updraft_terrain" }
updraft_units = { path = "../libs/updraft_units" }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
uuid = "=1.26.1"
webpki-roots = "=1.0.9"

[dev-dependencies]
approx = "=0.6.0-rc2"
claims = "=0.8.0"
image-webp = "=0.2.4"
insta = { version = "=1.48.0", features = ["json"] }
tauri = { version = "=2.11.5", features = ["test"] }
tokio = { version = "=1.53.1", features = ["test-util"] }
tracing-test = "=0.2.6"
